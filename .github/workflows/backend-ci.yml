name: Backend CI

on:
    push:
    pull_request:


jobs:
    backend-check:
        runs-on: ubuntu-latest

        env:
            SUPABASE_DB_URL: jdbc:postgresql://localhost:5432/gobison_test
            SUPABASE_DB_USERNAME: ci_user
            SUPABASE_DB_PASSWORD: ci_password
            SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: gobison_test
                    POSTGRES_USER: ci_user
                    POSTGRES_PASSWORD: ci_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U ci_user -d gobison_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Download project code
              uses: actions/checkout@v6

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                distribution: temurin
                java-version: '21'
            
            - name: Build and test backend
              working-directory: backend
              run: bash ./mvnw --batch-mode verify

            - name: Upload backend test reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                 name: backend-test-reports
                 path: backend/target/surefire-reports/
                 if-no-files-found: warn
        